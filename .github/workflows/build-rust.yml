name: Build rust

# Reusable build of the Rust binaries that sit beside Prisc.Ui in every package:
# the capture overlay, the scrolling capture driver,
# the in-process interop library (prisc_interop) Prisc.Ui and Prisc.VideoRender
# load, the prisc_ai inference binary (with its execution-provider dylibs and
# the VC++ CRT it needs on Windows), and on Windows the shell extension dll and
# its sparse MSIX. ci.yml calls it once; it runs alongside build-recorder.yml and
# build-ui.yml, and ci.yml's package job merges the three.
#
# Each artifact `rust-<rid>` holds one archive, `rust-<rid>.zip`, whose members
# sit at the archive root and unpack straight into the package directory. A zip
# rather than the loose tree because upload-artifact does not preserve unix file
# modes, and the macOS executables need theirs.
#
# Each Windows RID has a job of its own (this is the package's critical path,
# and Windows runners are plentiful); the two macOS RIDs share one job, the
# arm64 runner building x64 as a cross target, because the plan runs at most
# five macOS jobs at once across all of CI. Building them back to back in one
# job also compiles the build scripts and proc macros once for both.
on:
  workflow_call:
    inputs:
      version:
        description: The nbgv version ci.yml's plan job computed, stamped into the Sentry release name (crates/prisc_rust_core/src/telemetry.rs) and the MSIX manifest.
        type: string
        required: true
    secrets:
      SENTRY_AUTH_TOKEN:
        required: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: rust (${{ matrix.name }})
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # What each leg builds and ships (prisc_ai only where ONNX Runtime
          # exists, the shell extension only on Windows) comes from
          # tools/staging/shipped.sh, the list build.sh uses too.
          # The app jobs (here, build-ui.yml, ci.yml's tests and release.yml)
          # stay on macos-15, where they were pinned on purpose. Only the
          # recorder runs on macos-26, because OBS 32.2.2 needs Xcode 26.5
          # (build-recorder.yml). Moving the app jobs over is untested.
          - name: win-x64
            os: windows-latest
            rids: [win-x64]
            targets: x86_64-pc-windows-msvc
          - name: win-arm64
            os: windows-latest
            rids: [win-arm64]
            targets: aarch64-pc-windows-msvc
          - name: macos
            os: macos-15
            rids: [osx-arm64, osx-x64]
            targets: aarch64-apple-darwin, x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    # Lifted to the job so the Sentry step can test the token in an `if:`, where secrets are unavailable but env is; no SENTRY_ORG because an org token carries the slug itself.
    env:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
      # The Rust build has no nbgv hook, so the version ci.yml computed once is stamped into the
      # Sentry release name (crates/prisc_rust_core/src/telemetry.rs) and the MSIX manifest.
      PRISC_VERSION: ${{ inputs.version }}
      RIDS: ${{ join(matrix.rids, ' ') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      # Keyed per leg (the Windows legs share a runner OS). rust-cache already hashes every
      # Cargo.toml, Cargo.lock and .cargo/config.toml into the key, and a changed one still
      # restores the previous entry as a starting point (cargo rebuilds whatever it invalidated,
      # flags included), so they stay out of `key`: there they made any manifest edit a cold
      # build. Saved from master only, so branch runs restore master's entries instead of
      # evicting them.
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
          save-if: ${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/claude/ci-speedup' }}

      # Per RID: the packages in one invocation rather than one per crate, so codegen and the LTO
      # links overlap instead of leaving the runner idle. Explicit packages: the workspace also
      # holds the recorder crates, which build-recorder.yml builds. The ort crate's build downloads
      # pyke's prebuilt ONNX Runtime for the target and links prisc_ai statically.
      #
      # Then the in-process library in a cargo invocation of its own: built beside the packages
      # above, cargo would unify features across them and hand it prisc_rust_core's `telemetry`
      # (Sentry) from prisc_capture. Fails on cargo's "`default-features` is ignored for X" warning
      # (cargo wraps the key in backticks), which means a dependency line silently enables more
      # than it asks for, and on ld64's "duplicate symbol" warning. The check behind it is on the
      # artifact: exports only prisc_*, no Sentry symbol, only OS libraries as dependencies (and
      # the @rpath install name on macOS).
      - name: Build rust binaries
        run: |
          . tools/staging/shipped.sh
          for rid in $RIDS; do
            triple=$(rid_triple "$rid")
            echo "::group::$rid: packages"
            # shellcheck disable=SC2046 # word-split `-p <crate>` pairs
            cargo build --release --target "$triple" $(tools/staging/stage-app.sh packages "$rid")
            echo "::endgroup::"
            echo "::group::$rid: isolated libraries"
            log="$RUNNER_TEMP/isolated-build-$rid.log"
            : > "$log"
            while read -r args; do
              echo "==> cargo build --release --target $triple $args"
              # shellcheck disable=SC2086 # word-split `-p <crate>`
              cargo build --release --target "$triple" $args 2>&1 | tee -a "$log"
            done < <(tools/staging/stage-app.sh packages-isolated "$rid")
            if grep -E ".?default-features.? is ignored|duplicate symbol" "$log"; then
              echo "::error::the isolated $rid build printed a default-features or duplicate symbol warning"
              exit 1
            fi
            tools/staging/stage-app.sh verify-isolated "$rid" "target/$triple/release"
            echo "::endgroup::"
          done

      # Without these an LTO'd release build reports mangled frames with no file or line; skipped rather than failed when the token is absent (forks).
      # The recorder has no Sentry integration, so it uploads no debug files.
      - name: Upload debug files to Sentry
        if: env.SENTRY_AUTH_TOKEN != ''
        run: |
          . tools/staging/shipped.sh
          npm install -g @sentry/cli
          for rid in $RIDS; do
            tools/staging/stage-app.sh debug-files "$rid" "target/$(rid_triple "$rid")/release" | while IFS=$'\t' read -r dif bin; do
              sentry-cli debug-files upload "$dif" "$bin"
            done
          done

      # stage-<rid>/ unpacks into the package directory beside Prisc.Ui: the overlay, the scrolling
      # capture driver, the interop library and prisc_ai with its license, DirectML.dll and
      # (Windows) the VC++ runtime it alone imports. release.yml signs them with the rest: vpk's
      # Trusted Signing pass covers every dll in the pack dir, and the macOS app signing and
      # notarization cover every Mach-O in the bundle.
      - name: Stage rust binaries
        run: |
          . tools/staging/shipped.sh
          for rid in $RIDS; do
            tools/staging/stage-app.sh stage "$rid" "target/$(rid_triple "$rid")/release" "stage-$rid"
          done

      # The version in the filename means a changed extension arrives under a fresh name that a lock on the old copy cannot block.
      # Sparse package: the msix holds only the manifest + logos and /nv skips the payload validation that would reject its references to the external dll.
      - name: Stage shell extension + MSIX (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $extVersion = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages |
            Where-Object name -eq prisc_shell_ext | Select-Object -ExpandProperty version
          $makeappx = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\makeappx.exe' | Select-Object -Last 1
          foreach ($rid in $env:RIDS -split ' ') {
            $arch = $rid -replace '^win-', ''
            $triple = @{ x64 = 'x86_64-pc-windows-msvc'; arm64 = 'aarch64-pc-windows-msvc' }[$arch]
            Copy-Item "target/$triple/release/prisc_shell_ext.dll" "stage-$rid/PriscShellExt_$extVersion.dll"
            $staging = Join-Path $env:RUNNER_TEMP "msix-staging-$rid"
            New-Item -ItemType Directory -Path $staging | Out-Null
            Copy-Item -Recurse crates/prisc_shell_ext/msix/Assets (Join-Path $staging Assets)
            $manifest = (Get-Content crates/prisc_shell_ext/msix/AppxManifest.template.xml -Raw)
            $manifest = $manifest.Replace('{{VERSION}}', "$env:PRISC_VERSION.0").Replace('{{ARCH}}', $arch).Replace('{{EXTVERSION}}', $extVersion)
            Set-Content -Path (Join-Path $staging AppxManifest.xml) -Value $manifest -Encoding utf8
            & $makeappx.FullName pack /d $staging /p "stage-$rid/PriscShellExt.msix" /nv /o
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Archive stage
        run: |
          for rid in $RIDS; do
            if [ "$RUNNER_OS" = Windows ]; then
              pwsh -NoProfile -Command "Compress-Archive -Path 'stage-$rid/*' -DestinationPath 'rust-$rid.zip'"
            else
              (cd "stage-$rid" && zip -qry "../rust-$rid.zip" .)
            fi
          done

      # Only ci.yml's package job reads these, later in the same run.
      - name: Upload ${{ matrix.rids[0] }}
        uses: actions/upload-artifact@v7
        with:
          name: rust-${{ matrix.rids[0] }}
          path: rust-${{ matrix.rids[0] }}.zip
          if-no-files-found: error
          # Already a zip; re-deflating it only costs time.
          compression-level: 0
          retention-days: 1

      - name: Upload ${{ matrix.rids[1] }}
        if: matrix.rids[1]
        uses: actions/upload-artifact@v7
        with:
          name: rust-${{ matrix.rids[1] }}
          path: rust-${{ matrix.rids[1] }}.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
