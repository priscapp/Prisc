name: Build UI

# Reusable self-contained publish of Prisc.Ui and Prisc.VideoRender, the .NET half
# of every package. ci.yml calls it once; it runs alongside build-recorder.yml
# and build-rust.yml, and ci.yml's package job merges the three.
#
# One job per OS publishes both of its RIDs back to back: each publish takes
# about a minute, less than a job's own setup, and the macOS legs compete for
# the plan's five concurrent macOS runners with the rest of CI.
#
# Each artifact `ui-<rid>` holds one archive, `ui-<rid>.zip`, whose members sit
# at the archive root and become the package directory. A zip rather than the
# loose tree because upload-artifact does not preserve unix file modes, and the
# macOS apphosts need theirs.
on:
  workflow_call:

jobs:
  build:
    name: ui (${{ matrix.name }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-15, not the recorder's macos-26: see build-rust.yml.
          - { name: windows, os: windows-latest, rids: [win-x64, win-arm64] }
          - { name: macos, os: macos-15, rids: [osx-x64, osx-arm64] }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # nbgv needs full history to compute the version height.
          fetch-depth: 0

      # SDK 10 is required: Avalonia 12's XAML generators target Roslyn 4.14, and older SDKs skip them as CS9057 so the x:Name fields go missing.
      - name: Install .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # No PublishSingleFile: vpk pack (release.yml) requires a normal multi-file publish directory.
      #
      # macOS 26 gates its window design (the larger corner radius, the modern titlebar) on the
      # linked-SDK field of LC_BUILD_VERSION in the MAIN executable, not on any runtime API. That
      # executable is the .NET apphost, which Microsoft ships prebuilt declaring sdk 15.5, so
      # AppKit puts every Prisc window in the pre-Tahoe compatibility frame. Nothing in Avalonia
      # or the Info.plist can override it: libAvaloniaNative is already sdk 26.0 and AppKit never
      # looks at it. So the apphost gets that field stamped, leaving minos alone; sdk newer than
      # the deployment target is exactly what an ordinary Xcode build produces, and dyld enforces
      # only minos, so the package still runs everywhere it does today.
      #
      # Only gates above the currently declared 15.5 are newly opted into, which in practice means
      # the macOS 26 ones, so behaviour on macOS 12 through 15 is unchanged. Worth knowing that
      # this also opts the process into any future runtime cutoff for the screen capture APIs
      # deprecated in favour of ScreenCaptureKit: ScreenPixels still calls
      # CGWindowListCreateImage, which the SDK headers mark obsoleted=15.0 (compile time only,
      # and still returning images at runtime on 26.6, but Apple has signalled the intent).
      #
      # vtool cannot re-sign the apphost's ad-hoc signature (it only regenerates linker-signed
      # ones), so from here until vpk signs with Developer ID in release.yml this binary has an
      # invalid signature and is SIGKILLed on launch on Apple Silicon. That makes the uploaded
      # prisc-osx-* artifact unrunnable as-is; add `codesign -s - --force` after the stamp if
      # that ever needs to change.
      #
      # The render tool is a separate thin exe over Prisc.VideoSDK; publishing into the
      # same directory shares the self-contained runtime and SDK assemblies, so the
      # marginal cost is the apphost. JobRunner.ForVideoRender looks for it beside Prisc.Ui.
      #
      # Each archive holds the publish directory's members at its root.
      - name: Publish ${{ join(matrix.rids, ' and ') }}
        run: |
          for rid in ${{ join(matrix.rids, ' ') }}; do
            out="publish-$rid"
            echo "::group::$rid"
            dotnet publish ui/Prisc.Ui/Prisc.Ui.csproj -c Release -r "$rid" --self-contained true -o "$out"
            if [ "$RUNNER_OS" = macOS ]; then
              minos=$(vtool -show-build-version "$out/Prisc.Ui" | awk '/minos/ { print $2 }')
              vtool -set-build-version macos "$minos" 26.0 -replace -output "$out/Prisc.Ui" "$out/Prisc.Ui"
              vtool -show-build-version "$out/Prisc.Ui"
              # A silent no-op here would ship the legacy frame and go unnoticed until someone
              # looked at a window, so fail the build instead.
              vtool -show-build-version "$out/Prisc.Ui" | grep -qE '^\s*sdk 26\.' \
                || { echo "::error::apphost SDK stamp did not apply ($rid)"; exit 1; }
            fi
            dotnet publish ui/Prisc.VideoRender/Prisc.VideoRender.csproj -c Release -r "$rid" --self-contained true -o "$out"
            if [ "$RUNNER_OS" = Windows ]; then
              pwsh -NoProfile -Command "Compress-Archive -Path '$out/*' -DestinationPath 'ui-$rid.zip'"
            else
              (cd "$out" && zip -qry "../ui-$rid.zip" .)
            fi
            echo "::endgroup::"
          done

      # Only ci.yml's package job reads these, later in the same run.
      - name: Upload ${{ matrix.rids[0] }}
        uses: actions/upload-artifact@v7
        with:
          name: ui-${{ matrix.rids[0] }}
          path: ui-${{ matrix.rids[0] }}.zip
          if-no-files-found: error
          # Already a zip; re-deflating it only costs time.
          compression-level: 0
          retention-days: 1

      - name: Upload ${{ matrix.rids[1] }}
        uses: actions/upload-artifact@v7
        with:
          name: ui-${{ matrix.rids[1] }}
          path: ui-${{ matrix.rids[1] }}.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
