name: CI

# Test + package on every commit.
# Each package is the published Prisc.Ui app (build-ui.yml) with the Rust binaries
# beside it (build-rust.yml) and the recorder (prisc_recorder + libobs,
# build-recorder.yml) in a recorder/ subdirectory, the layout
# ScreenCaptureService/HelperLocator expects. Every package except osx-x64 (which
# upstream ONNX Runtime no longer supports) also carries the prisc_ai inference binary
# (OCR, matting, denoising) with its execution-provider dylibs.
#
# The three builds run in parallel and package only merges their outputs. The tests
# run beside them and gate the run, not the package.
#
# Job graph:
#   plan                                       version (artifact `version`, which release.yml
#                                              reads) and the input fingerprints below
#   recorder        build-recorder.yml         -> recorder-<rid>, Windows + macOS
#   recorder-linux  build-recorder-linux.yml   check only, nothing consumes it
#   rust            build-rust.yml             -> rust-<rid>, needs plan (stamps the version)
#   ui              build-ui.yml               -> ui-<rid>
#   rust-test                                  Rust gate: fmt, clippy + tests per crate, crate
#                                              boundaries, the interop library's link checks
#   dotnet-test                                native-interop check, Interop/Shared/Drawing/Ipc
#                                              dotnet tests, interop probe, then the video editor
#                                              suite against a recorder payload and GPU on WARP
#                                              (Windows) against tools/warp-baseline.txt
#   package         needs recorder, rust, ui   -> prisc-<rid>
#
# Skipping what did not change: tools/ci/fingerprint.sh hashes each component's inputs.
# A recorder leg whose inputs, toolchain included, built and passed before reuses that
# payload from the cache instead of building libobs and the recorder again, and
# rust-test skips when the same inputs already passed on that OS and toolchain. The
# version-stamped builds (rust, ui) and the dotnet suites run every time.
#
# Caching: the repository's Actions cache is 10 GB, and once over it GitHub evicts the
# least recently used entries, which turned warm builds cold at random. So every
# rust-cache saves from master only (branch runs restore master's entries), the debug
# jobs share one entry per OS (saved by rust-test), and the debug profile keeps line
# tables only.

on:
  push:
    paths-ignore:
      - "**.md"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Line tables still give file:line backtraces, at a fraction of the full debug info's size
  # and link time. The same in every debug job, so all of them share the rust-cache entry
  # (rust-cache hashes CARGO_* variables into its key).
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  # release.yml downloads the version artifact from a completed run and trusts it as that run's
  # version. The one place CI computes the version: build-rust.yml takes it as an input rather
  # than installing .NET and nbgv to compute it again (the .NET builds stamp it through nbgv's
  # MSBuild integration, from the same version.json and history).
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.nbgv.outputs.version }}
      recorder: ${{ steps.fingerprint.outputs.recorder }}
      recorder-natives: ${{ steps.fingerprint.outputs.recorder-natives }}
      rust-test: ${{ steps.fingerprint.outputs.rust-test }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute nbgv version
        id: nbgv
        run: |
          dotnet tool update -g nbgv
          # Capture first, write after: nbgv reads a repo-root version.txt as a legacy version file and crashes on the empty one tee would leave.
          VERSION="$(nbgv get-version -v SimpleVersion)"
          echo "$VERSION" | tee version.txt
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload version artifact
        uses: actions/upload-artifact@v7
        with:
          name: version
          path: version.txt
          if-no-files-found: error

      - name: Fingerprint inputs
        id: fingerprint
        run: |
          for component in recorder recorder-natives rust-test; do
            fingerprint=$(tools/ci/fingerprint.sh "$component")
            echo "$component: $fingerprint"
            echo "$component=$fingerprint" >> "$GITHUB_OUTPUT"
          done

  # The recorder stack (libobs via CMake, 20-40 min cold) builds in these two calls, the
  # only jobs that check out the obs-studio submodule, and only when no earlier run built
  # the same inputs.
  recorder:
    needs: plan
    uses: ./.github/workflows/build-recorder.yml
    with:
      fingerprint: ${{ needs.plan.outputs.recorder }}
      natives-fingerprint: ${{ needs.plan.outputs.recorder-natives }}

  # Linux has no app package yet; this proves the recorder still builds, tests and runs
  # there (bundle + portability checks). Nothing consumes its artifacts. A workflow of its
  # own so that package, which needs `recorder` as a whole, never waits on it.
  recorder-linux:
    needs: plan
    uses: ./.github/workflows/build-recorder-linux.yml
    with:
      fingerprint: ${{ needs.plan.outputs.recorder }}

  rust:
    needs: plan
    uses: ./.github/workflows/build-rust.yml
    with:
      version: ${{ needs.plan.outputs.version }}
    secrets:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

  ui:
    uses: ./.github/workflows/build-ui.yml

  rust-test:
    name: rust-test (${{ matrix.os }})
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-15, not the recorder's macos-26: see build-rust.yml.
          - os: windows-latest
            # For the Linux cross-check.
            targets: x86_64-unknown-linux-gnu
          - os: macos-15
            targets: ""
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        id: toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.targets }}

      # The marker is saved at the end of a passing run (the last step), so a hit means this
      # exact gate already passed for these inputs on this OS and toolchain.
      - name: Look up an earlier pass
        id: passed
        uses: actions/cache/restore@v6
        with:
          path: .ci-pass
          key: rust-test-${{ runner.os }}-${{ needs.plan.outputs.rust-test }}-${{ steps.toolchain.outputs.cachekey }}
          lookup-only: true

      - name: Run only on a miss
        run: |
          if [ "${{ steps.passed.outputs.cache-hit }}" = true ]; then
            echo "RUN=false" >> "$GITHUB_ENV"
            echo "::notice title=rust-test (${{ matrix.os }})::skipped: these inputs already passed on this OS and toolchain"
          else
            echo "RUN=true" >> "$GITHUB_ENV"
          fi

      # The debug entry dotnet-test restores too; only this job saves it.
      - name: Cache cargo build
        if: env.RUN == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: debug
          save-if: ${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/claude/ci-speedup' }}

      # Covers the whole workspace (the imported recorder crates opt out of formatting through
      # their own rustfmt.toml). Formatting does not depend on the OS, so one leg checks it.
      - name: "Rust gate: format"
        if: env.RUN == 'true' && runner.os == 'Windows'
        run: cargo fmt --check

      # App crates only. The recorder crates build libobs from their build scripts, so they
      # are built and tested in build-recorder.yml (their clippy is not gated yet).
      # One call per crate, never several -p together: that would unify dependency features
      # across them, so a crate that only compiles because a sibling enables a feature would pass.
      - name: "Rust gate: lint + tests"
        if: env.RUN == 'true'
        run: |
          gate() {
            local pkg=$1
            shift
            echo "::group::$pkg"
            cargo clippy -p "$pkg" "$@" -- -D warnings
            cargo test -p "$pkg"
            echo "::endgroup::"
          }
          gate prisc_ipc --all-targets
          gate prisc_rust_core --all-targets
          gate prisc_hotkeys --all-targets
          # prisc_capture has always been gated without --all-targets; widening that is a change of its own.
          gate prisc_capture
          gate prisc_scroll_driver --all-targets
          gate prisc_ai --all-targets
          gate prisc_platform --all-targets
          # Includes the harness = false main_thread_* targets, which run on the real main thread on macOS.
          gate prisc_interop --all-targets
          # Fails on a stale, missing or orphaned generated file and on any prisc_interop crate rule.
          gate prisc_codegen --all-targets
          # The shell extension is a Windows COM dll and an empty crate elsewhere.
          if [ "$RUNNER_OS" = Windows ]; then gate prisc_shell_ext; fi

      # The in-process library and the code generator must never link Sentry (prisc_interop only)
      # or anything GPL or from the recorder stack. The cheap early signal; build-rust.yml checks
      # the shipped artifact itself. `--target all` makes it the same on every OS, so one leg runs it.
      - name: "Rust gate: crate boundaries"
        if: env.RUN == 'true' && runner.os == 'Windows'
        run: |
          gpl='prisc_recorder|prisc_share_region|prisc_obs[a-z0-9_]*|prisc_vid2gif|prisc_ffmpeg_sys|prisc_build_support|prisc_ai'
          # Captured first: inside an `if` condition a failing cargo tree would just read as "no match".
          interop_tree=$(cargo tree -p prisc_interop -e normal --target all --prefix none)
          codegen_tree=$(cargo tree -p prisc_codegen -e normal --target all --prefix none)
          if grep -wE "sentry|$gpl" <<<"$interop_tree"; then
            echo "::error::prisc_interop depends on Sentry or on a GPL or recorder-stack crate (listed above)"
            exit 1
          fi
          if grep -wE "$gpl" <<<"$codegen_tree"; then
            echo "::error::prisc_codegen depends on a GPL or recorder-stack crate (listed above)"
            exit 1
          fi

      # prisc_hotkeys has no Linux backend yet, but Key/Gesture still build there, and CI has no
      # Linux app leg. prisc_platform and prisc_interop prove every unsupported arm compiles;
      # prisc_rust_core without features is what the Linux recorder now depends on
      # unconditionally. Plain Rust on Linux, so clippy needs no linker. One call per crate.
      - name: "Rust gate: Linux cross-check"
        if: env.RUN == 'true' && runner.os == 'Windows'
        run: |
          cargo clippy -p prisc_hotkeys --target x86_64-unknown-linux-gnu -- -D warnings
          cargo clippy -p prisc_platform --target x86_64-unknown-linux-gnu -- -D warnings
          cargo clippy -p prisc_interop --target x86_64-unknown-linux-gnu -- -D warnings
          cargo clippy -p prisc_rust_core --no-default-features --target x86_64-unknown-linux-gnu -- -D warnings

      # The library the dotnet tests load (dotnet-test builds it again from this job's cache).
      # Fails on cargo's "`default-features` is ignored for X" warning (a dependency line silently
      # enabling more than it asks for; cargo wraps the key in backticks) and on ld64's "duplicate
      # symbol" warning (a dependency's #[no_mangle] colliding with an export; ld64 keeps one and
      # only warns). On macOS it also fails on any exported symbol other than _prisc_* (an
      # #[export_name] static, such as objc2's define_class! emits), the same check stage-app.sh
      # makes on the release artifact, so it shows up here first.
      - name: "Rust gate: prisc_interop library"
        if: env.RUN == 'true'
        run: |
          cargo build -p prisc_interop 2>&1 | tee "$RUNNER_TEMP/interop-build.log"
          if grep -E ".?default-features.? is ignored|duplicate symbol" "$RUNNER_TEMP/interop-build.log"; then
            echo "::error::the prisc_interop build printed a default-features or duplicate symbol warning"
            exit 1
          fi
          if [ "$RUNNER_OS" = macOS ]; then
            foreign=$(nm -gU target/debug/libprisc_interop.dylib | awk 'NF { print $NF }' | grep -v '^_prisc_' || true)
            if [ -n "$foreign" ]; then
              echo "::error::libprisc_interop.dylib exports symbols other than _prisc_*: $(echo "$foreign" | tr '\n' ' ')"
              exit 1
            fi
          fi

      - name: Record the pass
        if: env.RUN == 'true'
        run: date -u > .ci-pass

      - name: Save the pass marker
        if: env.RUN == 'true'
        uses: actions/cache/save@v6
        with:
          path: .ci-pass
          key: ${{ steps.passed.outputs.cache-primary-key }}

  # The dotnet suites, then the video editor's: Prisc.VideoSDK.Tests covers the playback engine,
  # the compositor, the render/encode path, the audio clock and the editor model. Tests that need
  # something the runner has not got (FFmpeg, the prisc_ai binary, another platform) skip rather
  # than fail. One job per OS rather than two, as the plan runs at most five macOS jobs at once.
  dotnet-test:
    name: dotnet-test (${{ matrix.os }})
    needs: plan
    # actions: read lets .github/actions/recorder-payload wait for this run's recorder artifact.
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-15, not the recorder's macos-26: see build-rust.yml.
          - os: windows-latest
            rid: win-x64
            exe: .exe
          - os: macos-15
            rid: osx-arm64
            exe: ""
    runs-on: ${{ matrix.os }}
    # Can include waiting for a cold recorder build (see the payload step).
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # nbgv needs full history to compute the version height.
          fetch-depth: 0

      # C# reaches natives only through ui/Prisc.Interop (generated from crates/prisc_interop);
      # every other site is a line in tools/native-interop-allowlist. A scan of the sources, the
      # same on every OS, so one leg runs it.
      - name: Native interop check
        if: runner.os == 'Windows'
        run: tools/check-native-interop.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: debug
          save-if: false

      # SDK 10 is required: Avalonia 12's XAML generators target Roslyn 4.14, and older SDKs skip them as CS9057 so the x:Name fields go missing.
      - name: Install .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # The library the dotnet tests load: the loader finds target/debug by walking up from the
      # test binaries. rust-test gates its build warnings and exports.
      - name: Build prisc_interop (debug)
        run: cargo build -p prisc_interop

      # Prisc.VideoSDK.Tests runs below, once the recorder payload is in place.
      # PRISC_INTEROP_REQUIRED turns a missing or stale library into a failure instead of a skip.
      - name: "UI gate: dotnet tests"
        env:
          PRISC_INTEROP_REQUIRED: "1"
        run: |
          dotnet test ui/Prisc.Interop.Tests/Prisc.Interop.Tests.csproj -c Release --nologo
          dotnet test ui/Prisc.Shared.Tests/Prisc.Shared.Tests.csproj -c Release --nologo
          dotnet test ui/Prisc.Drawing.Tests/Prisc.Drawing.Tests.csproj -c Release --nologo
          dotnet test ui/Prisc.Ipc.Tests/Prisc.Ipc.Tests.csproj -c Release --nologo

      # Runs every kept C# facade and every wrapper once in the real app (a small real window on the
      # UI thread, then again from a thread-pool thread) and writes one JSON result per item. The
      # exit code counts `error` results only (a broken contract: a wrong status for a documented
      # case, a panic, a layout mismatch); `unavailable` and `denied` (the OS said no, as it does
      # for screen recording on a runner) never fail the step. Never requests a permission.
      # Runs even when the dotnet tests failed, so every run yields the probe JSON (on BASE it is
      # the Windows baseline of the old C# paths).
      - name: Interop probe smoke
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        env:
          PRISC_INTEROP_REQUIRED: "1"
          PRISC_DISABLE_TELEMETRY: "1"
        run: |
          dotnet build ui/Prisc.Ui/Prisc.Ui.csproj -c Release --nologo
          mkdir -p probe-out
          # The app takes a native path; the file checks below use the shell's.
          if [ "$RUNNER_OS" = Windows ]; then probe="$(pwd -W)/probe-out/probe.json"; else probe="$PWD/probe-out/probe.json"; fi
          status=0
          "ui/Prisc.Ui/bin/Release/net10.0/Prisc.Ui${{ runner.os == 'Windows' && '.exe' || '' }}" --interop-probe "$probe" || status=$?
          if [ ! -s probe-out/probe.json ]; then
            echo "::error::the interop probe wrote no results (exit code $status)"
            exit 1
          fi
          cat probe-out/probe.json
          if grep -qE '"status"[[:space:]]*:[[:space:]]*"error"' probe-out/probe.json || [ "$status" -ne 0 ]; then
            echo "::error::the interop probe reported broken contracts (exit code $status); see the error results above"
            exit 1
          fi

      - name: Upload interop probe results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: interop-probe-${{ matrix.os }}
          path: probe-out/probe.json
          if-no-files-found: warn

      # From here on the video editor's suite. PRISC_INTEROP_PATH is authoritative and inherited by
      # the Prisc.VideoRender children the render tests spawn; PRISC_INTEROP_REQUIRED turns a
      # missing or stale library into a failure instead of a skip. Set only now, so the suites above
      # keep finding the library through the dev walk-up. WARP stays off in the main suite: its GPU
      # tests skip without hardware; only the filtered WARP step below admits the software adapter.
      - name: Point the video tests at the interop library
        if: ${{ !cancelled() }}
        run: |
          lib="$PWD/target/debug/$(. tools/staging/shipped.sh && rid_cdylib ${{ matrix.rid }} prisc_interop)"
          [ -f "$lib" ] || { echo "::error::$lib was not built"; exit 1; }
          if [ "$RUNNER_OS" = Windows ]; then lib=$(cygpath -w "$lib"); fi
          echo "PRISC_INTEROP_PATH=$lib" >> "$GITHUB_ENV"
          echo "PRISC_INTEROP_REQUIRED=1" >> "$GITHUB_ENV"

      # The video editor's suite needs FFmpeg 8.1 natives to run its decode/encode/render tests;
      # without them ~100 of them skip. They come from a recorder payload, the same one a shipped
      # build carries, so what CI exercises is what users get, including HelperLocator's own
      # resolution of it: this points PRISC_HELPERS_DIR at the directory holding recorder/, exactly
      # the release layout, rather than PRISC_FFMPEG_PATH at a library directory, because the
      # layout differs per platform (beside the exe on Windows, Frameworks/ on macOS) and working
      # that out is the thing under test. The action takes a cached payload with the same natives
      # when it can, so this job does not wait for a recorder rebuild (see its description).
      #
      # Deliberately non-fatal: if no payload turns up (the recorder build failed), the variable
      # stays unset, those tests skip, and the other ~3300 still run.
      - name: Recorder payload
        if: ${{ !cancelled() }}
        id: payload
        uses: ./.github/actions/recorder-payload
        with:
          rid: ${{ matrix.rid }}
          fingerprint: ${{ needs.plan.outputs.recorder }}
          natives-fingerprint: ${{ needs.plan.outputs.recorder-natives }}

      - name: Recorder payload for the video editor tests
        if: ${{ !cancelled() }}
        run: |
          zip="dist/recorder-${{ matrix.rid }}.zip"
          if [ -f "$zip" ]; then
            mkdir -p recorder
            unzip -q "$zip" -d recorder
          fi
          exe="recorder/prisc_recorder${{ matrix.exe }}"
          if [ -f "$exe" ]; then
            echo "PRISC_HELPERS_DIR=$(pwd)" >> "$GITHUB_ENV"
          else
            echo "::warning::recorder payload unavailable; the FFmpeg-backed tests will skip"
          fi

      - name: "UI gate: video editor tests"
        if: ${{ !cancelled() }}
        run: dotnet test ui/Prisc.VideoSDK.Tests/Prisc.VideoSDK.Tests.csproj -c Release --nologo

      # The runner has no GPU, so the D3D12 paths only run on WARP, the software adapter, which
      # PRISC_GPU_ALLOW_WARP admits for this step alone. Only these filtered tests run on it (never
      # the whole suite): WARP is slow and lacks features, and NV12 answering E_CAPABILITY there is
      # a skip with a printed reason, never a pass. Here, after the payload, because the D3D11EncodeBridge
      # rigs need its FFmpeg natives, and they would all skip without them.
      # Test failures do not fail the run itself: the GPU code was never written for a software
      # adapter, so the set that must pass is the set recorded in tools/warp-baseline.txt, and
      # check-warp-baseline.sh fails on a test that passed there and no longer does (or a new test
      # that fails).
      - name: GPU on WARP (Windows)
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        env:
          PRISC_GPU_ALLOW_WARP: "1"
        run: |
          if [ -z "${PRISC_HELPERS_DIR:-}" ]; then
            echo "::warning::no recorder payload, so the D3D11EncodeBridge tests skip; this run cannot record or meet the WARP baseline for them"
          fi
          rm -rf warp-results
          status=0
          dotnet test ui/Prisc.VideoSDK.Tests/Prisc.VideoSDK.Tests.csproj -c Release --nologo \
            --filter "FullyQualifiedName~GpuInterop|FullyQualifiedName~ReadbackRing|FullyQualifiedName~D3D11EncodeBridge" \
            --logger "trx;LogFileName=warp.trx" --results-directory warp-results || status=$?
          echo "dotnet test exited $status; the baseline check below decides"
          tools/check-warp-baseline.sh warp-results/warp.trx tools/warp-baseline.txt warp-results/warp-baseline.txt

      # warp-baseline.txt in this artifact is this run's outcomes in the baseline format, the file
      # to copy over tools/warp-baseline.txt when the recorded set changes.
      - name: Upload WARP results (Windows)
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        uses: actions/upload-artifact@v7
        with:
          name: warp-results-${{ matrix.os }}
          path: warp-results/
          if-no-files-found: warn

      # New Rust code with no BASE counterpart, so it gates outright: the export-level harness, then
      # the in-crate ring, NV12 and device unit tests (the timeline lock, the self-check faults and
      # slot recovery), which skip on a runner unless WARP is admitted. A test that cannot run on
      # WARP (the NV12 converter needs a D3D11 video device) returns early with a printed reason,
      # which libtest would hide inside a pass: each one is surfaced here as a skip notice.
      - name: Rust ring harness on WARP (Windows)
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        env:
          PRISC_GPU_ALLOW_WARP: "1"
        run: |
          cargo test -p prisc_interop --test ring_harness
          cargo test -p prisc_interop --lib platform::windows::gpu -- --show-output 2>&1 | tee gpu-unit.log
          grep -h "^skipping " gpu-unit.log | sort -u | sed 's/^/::notice title=Skipped on WARP::/' || true

      # The FFmpeg dylib closure prisc_interop loads ahead of FFmpeg.AutoGen, against the real
      # payload: the closure test and the Mach-O reader's otool parity over every shipped dylib.
      # rust-test runs them too, but without a payload, so there they only cover fixtures.
      - name: FFmpeg closure over the payload (macOS)
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        run: |
          if [ -z "${PRISC_HELPERS_DIR:-}" ]; then
            echo "::warning::no recorder payload, so the FFmpeg closure tests cannot run against it"
            exit 0
          fi
          cargo test -p prisc_interop --test ipc_process preparing_the_payload -- --nocapture 2>&1 | tee closure.log
          if grep -q "skipping:" closure.log; then
            echo "::error::the payload closure test skipped although PRISC_HELPERS_DIR is set"
            exit 1
          fi
          cargo test -p prisc_interop --lib platform::macos::dylib

  # Merges the three builds for one rid: the UI publish is the package directory, the Rust
  # binaries go beside Prisc.Ui, and the recorder goes in recorder/. Pure file shuffling, so it
  # runs on Linux for every rid; Info-ZIP's unzip and zip there keep the macOS execute bits
  # and the recorder's framework symlinks, as they did on the macOS runner.
  package:
    name: package (${{ matrix.rid }})
    needs: [recorder, rust, ui]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-arm64, osx-x64, osx-arm64]
    steps:
      - name: Download UI publish
        uses: actions/download-artifact@v8
        with:
          name: ui-${{ matrix.rid }}
          path: artifacts

      - name: Download rust binaries
        uses: actions/download-artifact@v8
        with:
          name: rust-${{ matrix.rid }}
          path: artifacts

      - name: Download recorder
        uses: actions/download-artifact@v8
        with:
          name: recorder-${{ matrix.rid }}
          path: artifacts

      # Each archive holds its members at the root. The Rust stage goes in after the UI
      # publish and wins any collision (-o), as its copy steps did when this was one job.
      - name: Assemble package
        run: |
          unzip -q "artifacts/ui-${{ matrix.rid }}.zip" -d publish
          unzip -qo "artifacts/rust-${{ matrix.rid }}.zip" -d publish
          unzip -q "artifacts/recorder-${{ matrix.rid }}.zip" -d publish/recorder

      # Checked against tools/staging/shipped.sh, the list the three builds staged from, so a
      # binary that fell out of one of them fails here rather than in a release.
      - name: Checkout (staging scripts)
        uses: actions/checkout@v7
        with:
          path: src
          sparse-checkout: tools/staging

      - name: Verify package contents
        run: src/tools/staging/verify-package.sh "${{ matrix.rid }}" publish

      # upload-artifact does not preserve unix file modes, but a zip does. The checks make sure
      # the hop through this Linux runner kept the apphost's execute bit and the recorder's
      # framework symlinks.
      - name: Zip package (macOS)
        if: startsWith(matrix.rid, 'osx-')
        run: |
          set -euo pipefail
          zip="prisc-${{ matrix.rid }}.zip"
          (cd publish && zip -qry "../$zip" .)
          zipinfo "$zip" | grep -E ' Prisc\.Ui$' | grep -q '^-rwx' || { echo "::error::package lost the execute bit"; exit 1; }
          [ "$(zipinfo "$zip" | grep -c '^l')" -gt 0 ] || { echo "::error::package lost the recorder's symlinks"; exit 1; }

      - name: Upload package (macOS)
        if: startsWith(matrix.rid, 'osx-')
        uses: actions/upload-artifact@v7
        with:
          name: prisc-${{ matrix.rid }}
          path: prisc-${{ matrix.rid }}.zip
          if-no-files-found: error

      - name: Upload package (Windows)
        if: startsWith(matrix.rid, 'win-')
        uses: actions/upload-artifact@v7
        with:
          name: prisc-${{ matrix.rid }}
          path: publish/
          if-no-files-found: error
