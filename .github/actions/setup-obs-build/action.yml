name: Restore the recorder build cache
description: >
  Restores one recorder leg's build cache: the cargo target dir (the OBS build
  tree plus the recorder's compiled Rust deps), the OBS prebuilt deps
  (crates/obs-studio/.deps) and the cargo registry. Runs after a checkout with
  recursive submodules (a local action cannot check out the repository it
  lives in). The calling job saves the cache at its end with
  actions/cache/save, passing this action's `key` and `path` outputs.

  libobs is 20-40 min cold. The key starts with the obs-studio submodule SHA
  and a hash of the OBS build inputs, and the restore key never drops that
  prefix, so a restored CMake tree is always one configured from the same
  inputs. Only the toolchain, home directory and Cargo.lock part of the key may
  differ, and cargo rebuilds whatever they invalidated.

  The home directory is in the key because cargo's fingerprints hold the
  absolute path of every registry crate (under ~/.cargo), so a target dir only
  stays warm for the home that built it. The self-hosted macOS runners give
  each slot its own user, so each slot keeps its own entry and falls back to
  another slot's (the OBS tree and .deps still count) when it has none; on the
  GitHub-hosted runners the home is always the same.

inputs:
  arch:
    description: The leg's architecture (x64 or arm64). runner.os is the same for both arches of an OS, so it must be in every key.
    required: true
  path:
    description: What to cache from the target dir (newline-separated paths and globs).
    required: false
    default: target
  toolchain:
    description: dtolnay/rust-toolchain's `cachekey` output.
    required: true
  key-suffix:
    description: Further inputs of the native build that no hashed file covers (Linux's dependency pins).
    required: false
    default: ""

outputs:
  key:
    description: The exact key; save under this one.
    value: ${{ steps.key.outputs.key }}
  path:
    description: The cached paths; save these.
    value: ${{ steps.key.outputs.path }}
  cache-hit:
    description: "'true' on an exact key match, when there is nothing new to save."
    value: ${{ steps.restore.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Compute the cache key
      id: key
      shell: bash
      run: |
        sha=$(git -C crates/obs-studio rev-parse HEAD)
        echo "OBS submodule SHA: $sha"
        prefix="recorder-${{ runner.os }}-${{ inputs.arch }}-obs-$sha-${{ hashFiles('crates/prisc_obs_sys/build.rs', 'crates/prisc_obs_sys/cmake/**', 'crates/prisc_build_support/src/**') }}${{ inputs.key-suffix }}-"
        home=$(printf %s "$HOME" | cksum | cut -d' ' -f1)
        # ${prefix}, not $prefix: the toolchain key right after it would extend the variable name.
        own="${prefix}${{ inputs.toolchain }}-home$home-"
        echo "key=$own${{ hashFiles('Cargo.lock') }}" >> "$GITHUB_OUTPUT"
        # This home's latest entry first, then any home's.
        {
          echo "restore-keys<<EOF"
          echo "$own"
          echo "$prefix"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"
        {
          echo "path<<EOF"
          echo "${{ inputs.path }}"
          echo "crates/obs-studio/.deps"
          echo "~/.cargo/registry/index"
          echo "~/.cargo/registry/cache"
          echo "~/.cargo/git/db"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Restore the recorder build cache
      id: restore
      uses: actions/cache/restore@v6
      with:
        path: ${{ steps.key.outputs.path }}
        key: ${{ steps.key.outputs.key }}
        restore-keys: ${{ steps.key.outputs.restore-keys }}
