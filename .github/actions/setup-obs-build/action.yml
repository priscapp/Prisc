name: Set up the OBS build
description: >
  Prepares one recorder leg of build-recorder.yml or build-recorder-linux.yml
  that has to build (no cached payload for its inputs): checks out the
  submodules and restores the cargo registry and the native OBS build tree plus
  its downloaded dependencies (crates/obs-studio/.deps). Runs after a plain
  checkout; the legs that reuse a cached payload never check out the submodules.

  libobs is 20-40 min cold, so its build tree is cached per OS and arch, keyed
  by the obs-studio submodule SHA and the build inputs. There are no
  restore-keys: a partial match would be a stale CMake tree. The build tree and
  .deps share one entry so they can never evict independently. It is saved from
  any branch, since only a change to those inputs creates a new one.

inputs:
  arch:
    description: The leg's architecture (x64 or arm64). runner.os is the same for both arches of an OS, so it must be in every key.
    required: true
  obs-build-path:
    description: Where prisc_obs_sys leaves the OBS build tree on this OS (newline-separated paths and globs).
    required: true
  key-suffix:
    description: Further inputs of the native build that no hashed file covers (Linux's dependency pins).
    required: false
    default: ""

runs:
  using: composite
  steps:
    # Recursive: obs-studio's obs-browser / obs-websocket submodule dirs must EXIST even though
    # disabled, or their CMakeLists FATAL_ERROR. Shallow, as actions/checkout does it.
    - name: Check out the submodules
      shell: bash
      run: |
        git submodule sync --recursive
        git -c protocol.version=2 submodule update --init --force --depth=1 --recursive --jobs 4
        sha=$(git -C crates/obs-studio rev-parse HEAD)
        echo "OBS_SHA=$sha" >> "$GITHUB_ENV"
        echo "OBS submodule SHA: $sha"

    # Registry and git sources only (cache-targets: false). target/ holds the
    # OBS build tree, which the cache below owns under its own key, and
    # rust-cache's target cleanup would prune it. On Linux cargo runs in the
    # build image with the host's ~/.cargo mounted (run-in-image.sh), so the
    # same host-side cache serves it; the Linux job chowns those dirs back from
    # root as its last step, before this cache's post step prunes and saves.
    # Saved from master only, like every rust-cache in CI: branch runs restore
    # master's entries rather than evicting them with copies of their own.
    - name: Cache cargo registry
      uses: Swatinem/rust-cache@v2
      with:
        key: ${{ inputs.arch }}
        cache-targets: "false"
        save-if: ${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/claude/ci-speedup' }}

    - name: Cache OBS native build + prebuilt deps
      uses: actions/cache@v6
      with:
        path: |
          ${{ inputs.obs-build-path }}
          crates/obs-studio/.deps
        key: ${{ runner.os }}-${{ inputs.arch }}-obs-${{ env.OBS_SHA }}-${{ hashFiles('crates/prisc_obs_sys/build.rs', 'crates/prisc_obs_sys/cmake/**', 'crates/prisc_build_support/src/**') }}${{ inputs.key-suffix }}
